spring.application.name=V-Booth
server.port=${SPRING_SERVER_PORT}
spring.devtools.restart.enabled=false

# mendefine driver database (postgres)
spring.datasource.driver-class-name=org.postgresql.Driver

# untuk mengarahkan url ke db yang digunakan
spring.datasource.url=${SPRING_DATA_SOURCE_URL}

# untuk define username
spring.datasource.username=${SPRING_DATA_SOURCE_USERNAME}

# untuk define password
spring.datasource.password=${SPRING_DATA_SOURCE_PASSWORD}

# define hibernate dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# menitranslate Capital letter to _
# spring.jpa.hibernate.naming-strategy=org.hibernate.cfg.ImprovedNamingStrategy

# show query
spring.jpa.show-sql=true

# auto generate table
spring.jpa.hibernate.ddl-auto=update

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.access-token-cookie-name=${ACCESS_TOKEN_COOKIE_NAME}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
app.cors.allowed-origins=${SPRING_APP_CORS_ALLOWED_ORIGIN}
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=TRACE
app.cookie.secure=false
app.cookie.same-site=lax


